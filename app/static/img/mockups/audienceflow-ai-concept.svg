<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">AudienceFlow AI — Concept Mockup</title><desc id="desc">تصویر مفهومی رابط آینده؛ نرم‌افزار اجراشده، داده واقعی یا اتصال فعال نیست.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087ea4"/><stop offset="1" stop-color="#26b99a"/></linearGradient></defs><rect width="1200" height="760" rx="38" fill="#f4f6fa"/><rect width="1200" height="92" rx="38" fill="url(#bg)"/><path d="M0 60h1200v32H0z" fill="url(#bg)"/><text x="70" y="57" font-family="Arial" font-size="27" font-weight="bold" fill="#fff">AudienceFlow AI</text><rect x="735" y="22" width="395" height="48" rx="24" fill="#fff" opacity=".96"/><text x="932" y="52" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="17" font-weight="bold" fill="#8a4b16">MOCKUP / تصویر مفهومی — نرم‌افزار اجراشده نیست</text><text x="90" y="170" direction="rtl" font-family="Tahoma,Arial" font-size="31" font-weight="bold" fill="#1c2940">پیش‌نمایش هدف طراحی، نه داشبورد واقعی</text><text x="90" y="213" direction="rtl" font-family="Tahoma,Arial" font-size="18" fill="#67748a">تمام داده‌ها نمایشی‌اند؛ هیچ اتصال، هوش مصنوعی یا اتوماسیون فعالی وجود ندارد.</text><g transform="translate(90 300)"><rect width="230" height="250" rx="22" fill="#fff"/><rect width="230" height="7" rx="4" fill="#087ea4" opacity=".8"/><circle cx="34" cy="42" r="15" fill="#26b99a" opacity=".25"/><text x="60" y="48" font-family="Tahoma,Arial" font-size="18" font-weight="bold" fill="#24324a">کمپین رضایت‌محور</text><rect x="24" y="85" width="182" height="11" rx="5" fill="#e9edf4"/><rect x="24" y="111" width="142" height="11" rx="5" fill="#eef1f6"/><rect x="24" y="156" width="182" height="52" rx="12" fill="#087ea4" opacity=".08"/><path d="M40 193l24-17 23 7 29-18 31 9 33-11" fill="none" stroke="#26b99a" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(345 300)"><rect width="230" height=