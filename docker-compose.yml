services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/services.sqlite3
      UPLOAD_FOLDER: /data/uploads
      HOST: 0.0.0.0
      PORT: 9900
    ports:
      - "9900:9900"
    volumes:
      - app-data:/data
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9900/robots.txt')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
  uploads:
